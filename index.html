<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>client feedback</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #0a0a0a;
    --bg-raised: #131313;
    --line: #232323;
    --text: #f2f1ec;
    --muted: #8a8a86;
    --accent: #a3ff6b;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  a{ color:inherit; }

  /* ---------- header ---------- */
  header{
    padding: 64px 24px 40px;
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 32px;
  }
  .header-text{ flex: 1; min-width: 0; }
  .header-photo{
    flex-shrink: 0;
    width: 128px;
    height: 148px;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--line);
  }
  .header-photo img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  @media (max-width: 560px){
    header{ flex-direction: column-reverse; align-items: flex-start; }
    .header-photo{ width: 84px; height: 96px; }
  }
  .eyebrow{
    font-family:'Space Grotesk', sans-serif;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom: 20px;
  }
  .eyebrow::before{
    content:"";
    width:6px; height:6px;
    background: var(--accent);
    border-radius:50%;
    display:inline-block;
  }
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size: clamp(32px, 7vw, 52px);
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin-bottom: 18px;
  }
  header p{
    color: var(--muted);
    font-size: 15px;
    line-height: 1.6;
    max-width: 46ch;
  }

  .counter-row{
    display:flex;
    gap: 28px;
    margin-top: 36px;
    flex-wrap: wrap;
  }
  .counter{
    font-family:'Space Grotesk', sans-serif;
  }
  .counter .num{
    font-size: 28px;
    font-weight:700;
    color: var(--text);
  }
  .counter .label{
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  /* ---------- filter tabs ---------- */
  nav.filters{
    max-width: 720px;
    margin: 0 auto;
    padding: 0 24px 32px;
    display:flex;
    gap: 8px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--line);
    padding-bottom: 28px;
  }
  .tab{
    font-family:'Space Grotesk', sans-serif;
    font-size: 13px;
    letter-spacing: 0.02em;
    padding: 8px 16px;
    border-radius: 100px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .tab:hover{ border-color:#3a3a3a; color: var(--text); }
  .tab.active{
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
  }

  /* ---------- reviews list ---------- */
  main{
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 24px 20px;
  }
  .review{
    padding: 32px 0;
    border-bottom: 1px solid var(--line);
    display: grid;
    grid-template-columns: 96px 1fr;
    gap: 24px;
    animation: fadeIn 0.4s ease both;
  }
  .review:last-child{ border-bottom:none; }
  @keyframes fadeIn{
    from{ opacity:0; transform: translateY(6px); }
    to{ opacity:1; transform: translateY(0); }
  }
  .review-meta{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .review-name{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size: 16px;
  }
  .review-tag{
    font-size: 11px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .review-quote{
    font-size: 16px;
    line-height: 1.65;
    color: #dcdbd5;
  }
  .review-quote::before{ content: "“"; color: var(--muted); }
  .review-quote::after{ content: "”"; color: var(--muted); }
  .review-help{
    margin-top: 10px;
    font-size: 12.5px;
    color: var(--muted);
  }
  .review-help span{ color: #b5b5af; }

  @media (max-width: 520px){
    .review{ grid-template-columns: 1fr; gap: 8px; }
  }

  /* ---------- cta ---------- */
  .cta{
    max-width: 720px;
    margin: 40px auto 0;
    padding: 56px 24px 80px;
    text-align:center;
    border-top: 1px solid var(--line);
  }
  .cta p{
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 22px;
  }
  .cta-btn{
    display:inline-block;
    font-family:'Space Grotesk', sans-serif;
    letter-spacing: 0.02em;
    font-size: 15px;
    font-weight: 500;
    background: var(--accent);
    color: #0a0a0a;
    padding: 14px 30px;
    border-radius: 100px;
    text-decoration: none;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .cta-btn:hover{ transform: translateY(-2px); opacity:0.9; }

  footer{
    text-align:center;
    padding: 24px;
    font-size: 11px;
    color: #4a4a4a;
    letter-spacing: 0.04em;
  }
</style>
</head>

<nav class="filters" id="filters"></nav>

<main id="reviewList"></main>

<div class="cta">
  <p>Interested in training or rehab with me?</p>
  <a class="cta-btn" href="https://www.instagram.com/kojomadeit/" target="_blank" rel="noopener">Work With Me →</a>
</div>

<footer>Client Reviews</footer>

<script>
  // ============================================================
  // TO ADD A NEW REVIEW: just add a new object to this array.
  // category options: "rehab", "strength", "coaching"
  // ============================================================
  const reviews = [
    {
      name: "Frankie",
      quote: "I've had massive improvements in the shoulder, a lot less pain and more mobility. I've been doing it (shoulder strengthening exercises in the gym) three times a week for about two months, and it's a lot better.",
      category: "rehab",
      help: "Shoulder rehab programme"
    },
    {
      name: "Jade",
      quote: "I can't wait to do this week's METCON, it looks a lot of fun. The shoulder strengthening is helping, so I'm glad to continue with it.",
      category: "strength",
      help: "METCON & shoulder strengthening"
    },
    {
      name: "Faith",
      quote: "Thanks again for the workout routine, I actually enjoyed it when I went.",
      category: "coaching",
      help: "Programmed training routine"
    },
    {
      name: "Mo",
      quote: "Since I've started training with him, I've noticed a real difference in my physique. My hips had always been injury-prone, but after three weeks of following the step-by-step exercises, my hip feels good as new. I don't know how to thank him.",
      category: "rehab",
      help: "Hip injury rehab programme"
    },
    {
      name: "Charlie",
      quote: "This plan was just what I needed to achieve my goals in the perfect timing. I also found the plan easy to fit into my daily routine which was essential for me at this point. What bloody legend! The big day is tomorrow, I just wanted to say thank you again for all your help!",
      category: "rehab",
      help: "Return to running after knee pain"
    }
  ];

  const categoryLabels = {
    all: "All",
    rehab: "Rehab",
    strength: "Strength & Conditioning",
    coaching: "Coaching"
  };

  let activeFilter = "all";

  function renderCounters(){
    const total = reviews.length;
    const row = document.getElementById("counterRow");
    row.innerHTML = `
      <div class="counter"><div class="num">${String(total).padStart(2,"0")}</div><div class="label">Reviews Logged</div></div>
    `;
  }

  function renderFilters(){
    const present = ["all", ...new Set(reviews.map(r => r.category))];
    const nav = document.getElementById("filters");
    nav.innerHTML = present.map(cat => `
      <button class="tab ${cat === activeFilter ? 'active' : ''}" data-cat="${cat}">
        ${categoryLabels[cat] || cat}
      </button>
    `).join("");

    nav.querySelectorAll(".tab").forEach(btn => {
      btn.addEventListener("click", () => {
        activeFilter = btn.dataset.cat;
        renderFilters();
        renderReviews();
      });
    });
  }

  function renderReviews(){
    const list = document.getElementById("reviewList");
    const filtered = activeFilter === "all" ? reviews : reviews.filter(r => r.category === activeFilter);
    list.innerHTML = filtered.map(r => `
      <div class="review">
        <div class="review-meta">
          <div class="review-name">${r.name}</div>
          <div class="review-tag">${categoryLabels[r.category] || r.category}</div>
        </div>
        <div>
          <div class="review-quote">${r.quote}</div>
          ${r.help ? `<div class="review-help">Helped with: <span>${r.help}</span></div>` : ""}
        </div>
      </div>
    `).join("");
  }

  renderCounters();
  renderFilters();
  renderReviews();
</script>
