<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>client feedback</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #08090a;
    --bg-raised: #131313;
    --line: #232323;
    --text: #f2f1ec;
    --muted: #8a8a86;
    --accent: #a3ff6b;
    --card-bg: rgba(255,255,255,0.03);
    --card-border: rgba(255,255,255,0.08);
    --card-border-hover: rgba(255,255,255,0.18);
    --muted2: #a1a1aa;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    background:
      radial-gradient(ellipse 900px 500px at 70% -5%, rgba(16,185,129,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 10% 10%, rgba(80,100,140,0.07), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  a{ color:inherit; }

  /* ---------- header ---------- */
  header{
    padding: 64px 24px 40px;
    max-width: 960px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 32px;
  }
  .header-text{ flex: 1; min-width: 0; }
  .header-photo{
    flex-shrink: 0;
    width: 128px;
    height: 148px;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .header-photo img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  @media (max-width: 560px){
    header{ flex-direction: column-reverse; align-items: flex-start; }
    .header-photo{ width: 84px; height: 96px; }
  }
  .eyebrow{
    font-family:'Plus Jakarta Sans', sans-serif;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom: 20px;
  }
  .eyebrow::before{
    content:"";
    width:6px; height:6px;
    background: var(--accent);
    border-radius:50%;
    display:inline-block;
  }
  h1{
    font-family:'Plus Jakarta Sans', sans-serif;
    font-weight:700;
    font-size: clamp(32px, 7vw, 52px);
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin-bottom: 18px;
  }
  header p{
    color: var(--muted);
    font-size: 15px;
    line-height: 1.6;
    max-width: 46ch;
  }

  .counter-row{
    display:flex;
    gap: 28px;
    margin-top: 36px;
    flex-wrap: wrap;
    align-items: center;
  }
  .counter{
    font-family: 'Plus Jakarta Sans', monospace;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px;
    border-radius: 100px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .counter .num{
    font-family: 'Roboto Mono', 'Courier New', monospace;
    font-size: 16px;
    font-weight:700;
    color: var(--text);
    letter-spacing: 0.02em;
  }
  .counter .label{
    font-family: 'Roboto Mono', 'Courier New', monospace;
    font-size: 11px;
    color: var(--muted2);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .live-dot{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family: 'Roboto Mono', 'Courier New', monospace;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    color: #10B981;
    text-transform: uppercase;
  }
  .live-dot::before{
    content:"";
    width:7px; height:7px;
    border-radius:50%;
    background:#10B981;
    box-shadow: 0 0 8px rgba(16,185,129,0.8);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%, 100%{ opacity:1; transform: scale(1); }
    50%{ opacity:0.4; transform: scale(0.75); }
  }

  /* ---------- filter tabs ---------- */
  nav.filters{
    max-width: 960px;
    margin: 0 auto;
    padding: 0 24px 32px;
    display:flex;
    gap: 8px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--line);
    padding-bottom: 28px;
  }
  .tab{
    font-family:'Plus Jakarta Sans', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.02em;
    padding: 8px 16px;
    border-radius: 100px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.02);
    color: var(--muted2);
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .tab:hover{ border-color: rgba(255,255,255,0.25); color: var(--text); background: rgba(255,255,255,0.05); }
  .tab.active{
    background: #ffffff;
    color: #000000;
    border-color: #ffffff;
    box-shadow: 0 0 15px rgba(255,255,255,0.25);
  }

  /* ---------- reviews list ---------- */
  main{
    max-width: 960px;
    margin: 0 auto;
    padding: 40px 24px 20px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
    align-items: start;
  }
  @media (min-width: 768px){
    main{ grid-template-columns: repeat(2, 1fr); }
  }
  .review{
    padding: 20px;
    border-radius: 16px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: grid;
    grid-template-columns: 88px 1fr;
    gap: 16px;
    animation: fadeIn 0.4s ease both;
    transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .review:hover{
    transform: translateY(-2px);
    border-color: var(--card-border-hover);
    box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
  }
  @keyframes fadeIn{
    from{ opacity:0; transform: translateY(6px); }
    to{ opacity:1; transform: translateY(0); }
  }
  .review-meta{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .review-name{
    font-family:'Plus Jakarta Sans', sans-serif;
    font-weight:600;
    font-size: 16px;
  }
  .review-tag{
    font-size: 11px;
    color: var(--muted2);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .review-quote{
    font-size: 15.5px;
    line-height: 1.55;
    color: #ffffff;
  }
  .review-quote::before{ content: "“"; color: var(--muted); }
  .review-quote::after{ content: "”"; color: var(--muted); }
  .review-snapshot{
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 16px;
    padding: 14px 16px;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    font-size: 12.5px;
    line-height: 1.5;
  }
  .review-snapshot .row{ display:flex; gap: 8px; align-items: baseline; }
  .review-snapshot .row-label{
    display: inline-block;
    color: #10B981;
    background: rgba(16,185,129,0.12);
    border: 1px solid rgba(16,185,129,0.35);
    padding: 2px 9px;
    border-radius: 100px;
    font-family:'Plus Jakarta Sans', sans-serif;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    flex-shrink: 0;
  }
  .review-snapshot .row-text{ color: #c9c9c3; }
  .review-snapshot .row-text strong{ color:#ffffff; font-weight:700; }
  .review-help{
    margin-top: 10px;
    font-size: 12.5px;
    color: var(--muted);
  }
  .review-help span{ color: #b5b5af; }
  .review-help .help-label{
    font-variant: small-caps;
    letter-spacing: 0.03em;
    color: var(--muted);
  }

  /* ---------- media cards ---------- */
  .media-card{
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--card-border);
    min-height: 260px;
    background: var(--bg-raised);
    transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    animation: fadeIn 0.4s ease both;
  }
  .media-card:hover{
    transform: translateY(-2px);
    border-color: var(--card-border-hover);
    box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
  }
  .media-card img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    position: absolute;
    inset: 0;
  }
  .media-card::after{
    content:"";
    position:absolute;
    inset:0;
    background: linear-gradient(to top, rgba(0,0,0,0.6), transparent 55%);
  }
  .media-card .media-caption{
    position: absolute;
    left: 16px;
    bottom: 14px;
    z-index: 2;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #ffffff;
  }

  @media (max-width: 520px){
    .review{ grid-template-columns: 1fr; gap: 8px; }
  }

  /* ---------- cta ---------- */
  .cta{
    max-width: 960px;
    margin: 40px auto 0;
    padding: 56px 24px 80px;
    text-align:center;
    border-top: 1px solid var(--line);
  }
  .cta p{
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 22px;
  }
  .cta-btn{
    display:inline-block;
    font-family:'Plus Jakarta Sans', sans-serif;
    letter-spacing: 0.02em;
    font-size: 15px;
    font-weight: 500;
    background: var(--accent);
    color: #0a0a0a;
    padding: 14px 30px;
    border-radius: 100px;
    text-decoration: none;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .cta-btn:hover{ transform: translateY(-2px); opacity:0.9; }

  footer{
    text-align:center;
    padding: 24px;
    font-size: 11px;
    color: #4a4a4a;
    letter-spacing: 0.04em;
  }
</style>
</head>

  function mediaCardHTML(src, caption){
    return `
      <div class="media-card">
        <img src="${src}" alt="${caption}">
      </div>
    `;
  }

  function renderReviews(){
    const list = document.getElementById("reviewList");
    const filtered = activeFilter === "all" ? reviews : reviews.filter(r => r.categories.includes(activeFilter));

    const cardHTML = filtered.map(r => `
      <div class="review">
        <div class="review-meta">
          <div class="review-name">${r.name}</div>
          <div class="review-tag">${categoryLabels[r.categories[0]] || r.categories[0]}</div>
        </div>
        <div>
          ${r.starting || r.result ? `
          <div class="review-snapshot">
            ${r.starting ? `<div class="row"><span class="row-label">Before</span><span class="row-text">${r.starting}</span></div>` : ""}
            ${r.result ? `<div class="row"><span class="row-label">After</span><span class="row-text">${r.result}</span></div>` : ""}
          </div>` : ""}
          <div class="review-quote">${r.quote}</div>
          ${r.help ? `<div class="review-help"><span class="help-label">Focus:</span> <span>${r.help}</span></div>` : ""}
        </div>
      </div>
    `);

    // Only break up the grid with photos on the unfiltered "All" view,
    // since a filtered list is shorter and the fixed positions would look off.
    if (activeFilter === "all"){
      cardHTML.splice(2, 0, mediaCardHTML(mediaImages.overheadPress, "Structured Programming"));
      cardHTML.splice(5, 0, mediaCardHTML(mediaImages.logbook, "Tracked Progress"));
    }

    list.innerHTML = cardHTML.join("");
  }

  renderCounters();
  renderFilters();
  renderReviews();
</script>
