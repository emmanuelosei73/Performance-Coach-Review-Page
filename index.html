<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>client feedback</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #000000;
    --bg-raised: #16181c;
    --line: #2f3336;
    --text: #f2f1ec;
    --muted: #71767b;
    --accent: #a3ff6b;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  a{ color:inherit; }

  .app{
    max-width: 600px;
    margin: 0 auto;
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
    min-height: 100vh;
  }

  /* ---------- header ---------- */
  header{
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(12px);
    z-index: 10;
  }
  .eyebrow{
    font-family:'Space Grotesk', sans-serif;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    display:flex;
    align-items:center;
    gap:7px;
    margin-bottom: 14px;
  }
  .eyebrow::before{
    content:"";
    width:6px; height:6px;
    background: var(--accent);
    border-radius:50%;
    display:inline-block;
  }
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size: 21px;
    letter-spacing: -0.01em;
    margin-bottom: 6px;
  }
  header p{
    color: var(--muted);
    font-size: 14px;
    line-height: 1.5;
    max-width: 46ch;
    margin-bottom: 16px;
  }

  .counter-row{
    display:flex;
    gap: 20px;
  }
  .counter{
    font-family:'Space Grotesk', sans-serif;
    display:flex;
    align-items:baseline;
    gap: 6px;
  }
  .counter .num{
    font-size: 16px;
    font-weight:700;
    color: var(--text);
  }
  .counter .label{
    font-size: 12px;
    color: var(--muted);
  }

  /* ---------- filter tabs ---------- */
  nav.filters{
    display:flex;
    border-bottom: 1px solid var(--line);
  }
  .tab{
    flex: 1;
    font-family:'Space Grotesk', sans-serif;
    font-size: 13px;
    font-weight: 500;
    padding: 14px 8px;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
    position: relative;
    white-space: nowrap;
  }
  .tab:hover{ background: rgba(255,255,255,0.03); color: var(--text); }
  .tab.active{ color: var(--text); }
  .tab.active::after{
    content:"";
    position:absolute;
    bottom:0; left:50%;
    transform: translateX(-50%);
    width: 56px; height: 3px;
    background: var(--accent);
    border-radius: 3px;
  }

  /* ---------- feed ---------- */
  main{ padding-bottom: 8px; }

  .post{
    display: grid;
    grid-template-columns: 48px 1fr;
    gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
    animation: fadeIn 0.35s ease both;
    transition: background 0.1s ease;
  }
  .post:hover{ background: rgba(255,255,255,0.02); }
  @keyframes fadeIn{
    from{ opacity:0; transform: translateY(6px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .avatar{
    width: 44px; height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, #2c2f33, #1a1c1f);
    border: 1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 16px;
    color: var(--accent);
    flex-shrink: 0;
  }

  .post-body{ min-width: 0; }

  .post-head{
    display:flex;
    align-items:center;
    gap: 5px;
    flex-wrap: wrap;
    font-size: 14.5px;
    margin-bottom: 2px;
  }
  .post-name{
    font-weight: 700;
    color: var(--text);
  }
  .post-handle{
    font-weight: 700;
    color: var(--text);
  }
  .post-dot{ color: var(--muted); }
  .post-time{ color: var(--muted); }

  .post-tag{
    display:inline-block;
    font-size: 11px;
    color: var(--accent);
    background: rgba(163,255,107,0.08);
    border: 1px solid rgba(163,255,107,0.2);
    padding: 2px 9px;
    border-radius: 100px;
    margin-bottom: 8px;
  }

  .post-text{
    font-size: 15px;
    line-height: 1.5;
    color: #e7e6e1;
    white-space: pre-wrap;
    margin-bottom: 10px;
  }

  .post-help{
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .post-help span{ color: #b5b5af; }

  .post-actions{
    display:flex;
    gap: 40px;
    max-width: 300px;
    color: var(--muted);
  }
  .post-actions .action{
    display:flex;
    align-items:center;
    gap: 6px;
    font-size: 13px;
    cursor: default;
  }
  .post-actions svg{ width:17px; height:17px; }

  /* ---------- cta ---------- */
  .cta{
    padding: 40px 20px 56px;
    text-align:center;
    border-bottom: 1px solid var(--line);
  }
  .cta p{
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 20px;
  }
  .cta-btn{
    display:inline-block;
    font-family:'Space Grotesk', sans-serif;
    letter-spacing: 0.02em;
    font-size: 15px;
    font-weight: 700;
    background: var(--accent);
    color: #0a0a0a;
    padding: 13px 28px;
    border-radius: 100px;
    text-decoration: none;
    transition: opacity 0.15s ease;
  }
  .cta-btn:hover{ opacity:0.85; }

  footer{
    text-align:center;
    padding: 20px;
    font-size: 11px;
    color: #4a4a4a;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>

<div class="app">

  <header>
    <div class="eyebrow">Performance Coach</div>
    <h1>Client Feedback</h1>
    <p>A running record of what clients say after training or rehab sessions with me.</p>
    <div class="counter-row" id="counterRow"></div>
  </header>

  <nav class="filters" id="filters"></nav>

  <main id="reviewList"></main>

  <div class="cta">
    <p>Interested in training or rehab with me?</p>
    <a class="cta-btn" href="https://www.instagram.com/kojomadeit/" target="_blank" rel="noopener">Work With Me →</a>
  </div>

  <footer>Client Reviews</footer>

</div>

<script>
  // ============================================================
  // TO ADD A NEW REVIEW: just add a new object to this array.
  // category options: "rehab", "strength", "coaching"
  // ============================================================
  const reviews = [
    {
      name: "Frankie",
      quote: "I've had massive improvements in the shoulder, a lot less pain and more mobility. I've been doing it (shoulder strengthening exercises in the gym) three times a week for about two months, and it's a lot better.",
      category: "rehab",
      help: "Shoulder rehab programme"
    },
    {
      name: "Jade",
      quote: "I can't wait to do this week's METCON, it looks a lot of fun. The shoulder strengthening is helping, so I'm glad to continue with it.",
      category: "strength",
      help: "METCON & shoulder strengthening"
    },
    {
      name: "Faith",
      quote: "Thanks again for the workout routine, I actually enjoyed it when I went.",
      category: "coaching",
      help: "Programmed training routine"
    },
    {
      name: "Mo",
      quote: "Since I've started training with him, I've noticed a real difference in my physique. My hips had always been injury-prone, but after three weeks of following the step-by-step exercises, my hip feels good as new. I don't know how to thank him.",
      category: "rehab",
      help: "Hip injury rehab programme"
    },
    {
      name: "Charlie",
      quote: "This plan was just what I needed to achieve my goals in the perfect timing. I also found the plan easy to fit into my daily routine which was essential for me at this point. What bloody legend! The big day is tomorrow, I just wanted to say thank you again for all your help!",
      category: "rehab",
      help: "Return to running after knee pain"
    }
  ];

  const categoryLabels = {
    all: "All",
    rehab: "Rehab",
    strength: "Strength & Conditioning",
    coaching: "Coaching"
  };

  let activeFilter = "all";

  function renderCounters(){
    const total = reviews.length;
    const row = document.getElementById("counterRow");
    row.innerHTML = `
      <div class="counter"><span class="num">${total}</span><span class="label">Reviews Logged</span></div>
    `;
  }

  function renderFilters(){
    const present = ["all", ...new Set(reviews.map(r => r.category))];
    const nav = document.getElementById("filters");
    nav.innerHTML = present.map(cat => `
      <button class="tab ${cat === activeFilter ? 'active' : ''}" data-cat="${cat}">
        ${categoryLabels[cat] || cat}
      </button>
    `).join("");

    nav.querySelectorAll(".tab").forEach(btn => {
      btn.addEventListener("click", () => {
        activeFilter = btn.dataset.cat;
        renderFilters();
        renderReviews();
      });
    });
  }

  function heartIcon(){
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>`;
  }
  function replyIcon(){
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>`;
  }
  function shareIcon(){
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v14"/></svg>`;
  }

  function renderReviews(){
    const list = document.getElementById("reviewList");
    const filtered = activeFilter === "all" ? reviews : reviews.filter(r => r.category === activeFilter);
    list.innerHTML = filtered.map(r => `
      <div class="post">
        <div class="avatar">${r.name.charAt(0)}</div>
        <div class="post-body">
          <div class="post-head">
            <span class="post-name">${r.name}</span>
          </div>
          <div class="post-tag">${categoryLabels[r.category] || r.category}</div>
          <div class="post-text">${r.quote}</div>
          ${r.help ? `<div class="post-help">Helped with: <span>${r.help}</span></div>` : ""}
          <div class="post-actions">
            <div class="action">${replyIcon()}</div>
            <div class="action">${heartIcon()}</div>
            <div class="action">${shareIcon()}</div>
          </div>
        </div>
      </div>
    `).join("");
  }

  renderCounters();
  renderFilters();
  renderReviews();
</script>

</body>
</html>
