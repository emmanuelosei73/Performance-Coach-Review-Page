<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>client feedback</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #08090a;
    --bg-raised: #131313;
    --line: #232323;
    --text: #f2f1ec;
    --muted: #8a8a86;
    --accent: #a3ff6b;
    --card-bg: rgba(255,255,255,0.03);
    --card-border: rgba(255,255,255,0.08);
    --card-border-hover: rgba(255,255,255,0.18);
    --muted2: #a1a1aa;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    background:
      radial-gradient(ellipse 900px 500px at 70% -5%, rgba(16,185,129,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 10% 10%, rgba(80,100,140,0.07), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  a{ color:inherit; }

  /* ---------- header ---------- */
  header{
    padding: 72px 24px 44px;
    max-width: 1080px;
    margin: 0 auto;
    display:grid;
    grid-template-columns: minmax(0,1fr) 150px;
    gap:48px;
    align-items:center;
    position:relative;
  }
  .header-text{ min-width:0; position:relative; z-index:1; }
  .header-photo{
    position:relative;
    z-index:1;
    width:170px;
    height:170px;
    justify-self:center;
    border-radius:50%;
    overflow:hidden;
    border:1px solid rgba(255,255,255,0.14);
    box-shadow: 0 24px 70px rgba(0,0,0,0.45), 0 0 0 8px rgba(163,255,107,0.035);
    transition: box-shadow .3s ease, transform .3s ease;
  }
  .header-photo:hover{ transform:scale(1.015); box-shadow:0 30px 82px rgba(0,0,0,.52), 0 0 0 8px rgba(163,255,107,0.05); }
  .header-photo img{ width:100%; height:100%; object-fit:cover; object-position:center center; display:block; }
  @media (max-width: 640px){
    header{ grid-template-columns:1fr; gap:24px; padding-top:48px; }
    .header-photo{ width:118px; height:118px; border-radius:50%; grid-row:1; justify-self:start; }
  }
  .eyebrow{
    font-family:'Plus Jakarta Sans', sans-serif;
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--accent);
    display:flex;
    align-items:center;
    gap:9px;
    margin-bottom:18px;
  }
  .eyebrow::before{ content:""; width:7px; height:7px; background:var(--accent); border-radius:50%; box-shadow:0 0 16px rgba(163,255,107,.75); }
  h1{
    font-family:'Plus Jakarta Sans', sans-serif;
    font-weight:800;
    font-size:clamp(42px,7vw,68px);
    line-height:.98;
    letter-spacing:-.045em;
    margin-bottom:18px;
  }
  header p{ color:var(--muted); font-size:15px; line-height:1.7; max-width:52ch; }

  .counter-row{ display:flex; gap:12px; margin-top:30px; flex-wrap:wrap; align-items:center; }
  .counter{
    font-family:'Plus Jakarta Sans', sans-serif;
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:9px 15px;
    border-radius:14px;
    background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.025));
    border:1px solid rgba(255,255,255,.09);
  }
  .counter .num{ font-family:'Roboto Mono','Courier New',monospace; font-size:15px; font-weight:700; color:var(--text); }
  .counter .label{ font-family:'Roboto Mono','Courier New',monospace; font-size:10px; color:var(--muted2); text-transform:uppercase; letter-spacing:.08em; }
  .live-dot{ display:inline-flex; align-items:center; gap:7px; font-family:'Roboto Mono','Courier New',monospace; font-size:10px; letter-spacing:.1em; color:#10B981; text-transform:uppercase; padding:9px 0; }
  .live-dot::before{ content:""; width:7px; height:7px; border-radius:50%; background:#10B981; box-shadow:0 0 10px rgba(16,185,129,.8); animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.75)} }

  /* ---------- filter tabs ---------- */
  nav.filters{
    max-width:1080px;
    margin:0 auto;
    padding:0 24px 24px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    position:relative;
    z-index:2;
  }
  .tab{
    font-family:'Plus Jakarta Sans',sans-serif;
    font-weight:600;
    font-size:12px;
    letter-spacing:.02em;
    padding:10px 15px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.09);
    background:rgba(255,255,255,.025);
    color:var(--muted2);
    cursor:pointer;
    transition:transform .2s ease, background .2s ease, border-color .2s ease, color .2s ease;
  }
  .tab:hover{ transform:translateY(-2px); border-color:rgba(255,255,255,.25); color:var(--text); background:rgba(255,255,255,.055); }
  .tab.active{ background:var(--accent); color:#091008; border-color:var(--accent); box-shadow:0 8px 24px rgba(163,255,107,.12); }

  /* ---------- feedback wall ---------- */
  main{
    max-width:1080px;
    margin:0 auto;
    padding:26px 24px 24px;
    display:grid;
    grid-template-columns:repeat(12,minmax(0,1fr));
    gap:18px;
    align-items:start;
    position:relative;
  }
  main::before, main::after{
    content:"";
    position:absolute;
    border-radius:50%;
    pointer-events:none;
    filter:blur(.2px);
    z-index:0;
  }
  main::before{ width:9px; height:9px; background:var(--accent); left:7%; top:11%; box-shadow:0 0 22px rgba(163,255,107,.55); animation:driftA 7s ease-in-out infinite; }
  main::after{ width:6px; height:6px; background:#fff; opacity:.35; right:8%; top:38%; animation:driftB 8s ease-in-out infinite; }
  @keyframes driftA{ 0%,100%{transform:translate(0,0)} 50%{transform:translate(24px,-16px)} }
  @keyframes driftB{ 0%,100%{transform:translate(0,0)} 50%{transform:translate(-18px,22px)} }
  .review{
    grid-column:span 6;
    min-height:220px;
    padding:24px;
    border-radius:22px;
    background:linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.018));
    border:1px solid var(--card-border);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    display:flex;
    flex-direction:column;
    gap:24px;
    position:relative;
    z-index:1;
    overflow:hidden;
    animation:fadeIn .45s ease both;
    transition:transform .28s cubic-bezier(.2,.8,.2,1), border-color .28s ease, box-shadow .28s ease;
  }
  .review::before{
    content:"";
    position:absolute;
    width:120px;
    height:120px;
    right:-58px;
    top:-58px;
    border-radius:50%;
    border:1px solid rgba(163,255,107,.13);
    transition:transform .35s ease;
  }
  .review:hover{ transform:translateY(-8px); border-color:rgba(255,255,255,.2); box-shadow:0 24px 60px -28px rgba(0,0,0,.82); }
  .review:hover::before{ transform:scale(1.25); }
  .review:nth-child(1){ grid-column:span 7; min-height:245px; }
  .review:nth-child(2){ grid-column:span 5; margin-top:30px; }
  .review:nth-child(3){ grid-column:span 5; }
  .review:nth-child(4){ grid-column:span 7; margin-top:-22px; }
  .review:nth-child(5){ grid-column:span 6; }
  .review:nth-child(6){ grid-column:span 6; margin-top:24px; }
  @keyframes fadeIn{ from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
  .review-meta{ display:flex; align-items:center; justify-content:space-between; gap:14px; }
  .review-name{ font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:18px; letter-spacing:-.02em; }
  .review-tag{
    font-size:10px;
    color:var(--accent);
    text-transform:uppercase;
    letter-spacing:.11em;
    border:1px solid rgba(163,255,107,.24);
    background:rgba(163,255,107,.055);
    padding:6px 9px;
    border-radius:100px;
    white-space:nowrap;
  }
  .review-quote{ font-size:clamp(16px,1.7vw,19px); line-height:1.55; color:#f8f8f5; letter-spacing:-.01em; flex:1; }
  .review-quote::before{ content:"“"; color:var(--accent); margin-right:2px; }
  .review-quote::after{ content:"”"; color:var(--accent); margin-left:2px; }
  .review-help{
    margin-top:auto;
    padding-top:16px;
    border-top:1px solid rgba(255,255,255,.075);
    font-size:12px;
    color:var(--muted);
    display:flex;
    gap:7px;
    align-items:center;
  }
  .review-help .help-label{ color:var(--muted); text-transform:uppercase; letter-spacing:.09em; font-size:10px; }
  .review-help span:last-child{ color:#c9c9c3; }
  @media (max-width:760px){
    main{ grid-template-columns:1fr; gap:14px; padding-top:18px; }
    .review,.review:nth-child(n){ grid-column:1; margin-top:0; min-height:auto; }
    .review{ padding:21px; gap:20px; }
  }

  /* ---------- cta ---------- */
  .cta{
    max-width: 960px;
    margin: 40px auto 0;
    padding: 56px 24px 80px;
    text-align:center;
    border-top: 1px solid var(--line);
  }
  .cta p{
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 22px;
  }
  .cta-btn{
    display:inline-block;
    font-family:'Plus Jakarta Sans', sans-serif;
    letter-spacing: 0.02em;
    font-size: 15px;
    font-weight: 500;
    background: var(--accent);
    color: #0a0a0a;
    padding: 14px 30px;
    border-radius: 100px;
    text-decoration: none;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .cta-btn:hover{ transform: translateY(-2px); opacity:0.9; }

  footer{
    text-align:center;
    padding: 24px;
    font-size: 11px;
    color: #4a4a4a;
    letter-spacing: 0.04em;
  }
</style>
</head>

<main id="reviewList"></main>

<div class="cta">
  <p>Interested in training or rehab with me?</p>
  <a class="cta-btn" href="https://www.instagram.com/kojomadeit/" target="_blank" rel="noopener">Work With Me →</a>
</div>

<footer>Client Reviews</footer>

<script>
  // ============================================================
  // TO ADD A NEW REVIEW: just add a new object to this array.
  // categories: an array, can include one or more of:
  // "rehab", "strength", "coaching"
  // The FIRST category listed is the one shown as the tag on the
  // card. Any additional categories still make the review appear
  // when that filter is selected, they just aren't displayed.
  // ============================================================
  const reviews = [
    {
      name: "Frankie",
      quote: "I've had massive improvements in the shoulder, a lot less pain and more mobility. I've been doing it (shoulder strengthening exercises in the gym) three times a week for about two months, and it's a lot better.",
      categories: ["rehab"],
      help: "Shoulder rehab"
    },
    {
      name: "Jade",
      quote: "I can't wait to do this week's METCON, it looks a lot of fun. The shoulder strengthening is helping, so I'm glad to continue with it.",
      categories: ["strength", "rehab"],
      help: "METCON & shoulder strengthening"
    },
    {
      name: "Faith",
      quote: "Thanks again for the workout routine, I actually enjoyed it when I went.",
      categories: ["coaching"],
      help: "Structured training routine"
    },
    {
      name: "Mo",
      quote: "Since I've started training with him, I've noticed a real difference in my physique. My hips had always been injury-prone, but after three weeks of following the step-by-step exercises, my hip feels good as new. I don't know how to thank him.",
      categories: ["rehab"],
      help: "Hip injury rehab"
    },
    {
      name: "Charlie",
      quote: "This plan was just what I needed to achieve my goals in the perfect timing. I also found the plan easy to fit into my daily routine which was essential for me at this point. What bloody legend! The big day is tomorrow, I just wanted to say thank you again for all your help!",
      categories: ["rehab"],
      help: "Return to running after knee pain"
    },
    {
      name: "Kirsten",
      quote: "Emmanuel is an awesome instructor. Sessions begin and end on time, and stations are set up well in advance. He explains each exercise, ensures correct form, and brings so much positivity and knowledge to every class. Every session is fresh, creative, and engaging.",
      categories: ["coaching"],
      help: "Group circuit sessions"
    }
  ];

  const categoryLabels = {
    all: "All",
    rehab: "Rehab",
    strength: "Strength & Conditioning",
    coaching: "Coaching"
  };

  let activeFilter = "all";

  function renderCounters(){
    const count = activeFilter === "all" ? reviews.length : reviews.filter(r => r.categories.includes(activeFilter)).length;
    const row = document.getElementById("counterRow");
    row.innerHTML = `
      <div class="counter"><span class="num">${String(count).padStart(2,"0")}</span><span class="label">Reviews Logged</span></div>
      <span class="live-dot">Live Log</span>
    `;
  }

  function renderFilters(){
    const present = ["all", ...new Set(reviews.flatMap(r => r.categories))];
    const nav = document.getElementById("filters");
    nav.innerHTML = present.map(cat => `
      <button class="tab ${cat === activeFilter ? 'active' : ''}" data-cat="${cat}">
        ${categoryLabels[cat] || cat}
      </button>
    `).join("");

    nav.querySelectorAll(".tab").forEach(btn => {
      btn.addEventListener("click", () => {
        activeFilter = btn.dataset.cat;
        renderFilters();
        renderCounters();
        renderReviews();
      });
    });
  }

  function renderReviews(){
    const list = document.getElementById("reviewList");
    const filtered = activeFilter === "all" ? reviews : reviews.filter(r => r.categories.includes(activeFilter));

    list.innerHTML = filtered.map(r => `
      <article class="review">
        <div class="review-meta">
          <div class="review-name">${r.name}</div>
          <div class="review-tag">${categoryLabels[r.categories[0]] || r.categories[0]}</div>
        </div>
        <div class="review-quote">${r.quote}</div>
        ${r.help ? `<div class="review-help"><span class="help-label">Focus</span><span>${r.help}</span></div>` : ""}
      </article>
    `).join("");
  }

  renderCounters();
  renderFilters();
  renderReviews();
</script>
